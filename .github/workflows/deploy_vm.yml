name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build (di runner, bukan di VM)
        run: |
          composer install --optimize-autoloader --no-dev
          npm install
          npm run build

      - name: Rsync ke VM
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: ./
          remote_path: /var/www/sumorrow
          remote_host: ${{ secrets.VM_HOST }}
          remote_user: ${{ secrets.VM_USERNAME }}
          remote_key: ${{ secrets.VM_SSH_KEY }}

      - name: Finalisasi di VM (migrasi & restart service saja, bukan build)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /var/www/sumorrow
            php artisan migrate --force
            php artisan config:cache
            sudo systemctl reload nginx
            sudo systemctl restart php8.4-fpm